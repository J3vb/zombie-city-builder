name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.5.1-stable

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - run: gdlint scripts tests
      - run: gdformat --check scripts tests

  godot:
    name: Import and test (Godot headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
      - name: Build native pathfinding
        run: python3 tools/build_flow.py
      - name: Import project
        run: |
          ~/godot/godot --headless --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" import.log; then exit 1; fi
      - name: Verify native pathfinding loads
        run: ~/godot/godot --headless --script res://tests/bench_flow_field.gd -- require-native
      - name: Run tests
        run: |
          set -o pipefail
          ~/godot/godot --headless --script res://tests/run_tests.gd 2>&1 | tee tests.log
          # A script error stops a test early without failing it, so fail on it here.
          if grep -E "SCRIPT ERROR" tests.log; then exit 1; fi
      - name: Run main scene for a few frames
        run: |
          ~/godot/godot --headless --quit-after 120 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" run.log; then exit 1; fi

      - name: Hold Station 4 through the tenth night
        run: |
          set -o pipefail
          ~/godot/godot --headless --script res://tests/play_opening.gd 2>&1 | tee opening.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" opening.log; then exit 1; fi

      - name: Keep the expedition settlement running for fifteen nights
        run: |
          set -o pipefail
          ~/godot/godot --headless --script res://tests/play_opening.gd -- basin 2>&1 | tee basin.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" basin.log; then exit 1; fi

      - name: Save and resume a settlement through thirty nights
        run: |
          set -o pipefail
          ~/godot/godot --headless --script res://tests/play_opening.gd -- month 2>&1 | tee month.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" month.log; then exit 1; fi
          grep -q "Day 31: 30 waves" month.log

  windows:
    name: Package and launch Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Windows editor and x64 templates
        uses: actions/cache@v4
        with:
          path: |
            ~/htg-tools/4.5.1-stable
            ~/htg-tools/Godot/export_templates
          key: windows-x64-${{ hashFiles('tools/windows_toolchain.py') }}
      - name: Install matching official Godot binaries
        run: python tools/windows_toolchain.py "$env:USERPROFILE/htg-tools"
      - name: Export and launch the packaged settlement
        run: ./tools/package_windows.ps1 -ToolCache "$env:USERPROFILE/htg-tools" -Version "$env:GITHUB_SHA"
      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: HoldTheGates-Windows-x64-${{ github.sha }}
          path: |
            build/windows/${{ github.sha }}/*.exe
            build/windows/${{ github.sha }}/*.dll
            build/windows/${{ github.sha }}/*.pck
            build/windows/${{ github.sha }}/*-LICENSE.txt
          if-no-files-found: error

      - name: Build and test the self-updating launcher
        run: ./tools/build_launcher.ps1 -Version "0.1.$env:GITHUB_RUN_NUMBER" -OutputDirectory build/launcher -Tests
      - name: Package and verify the public download
        run: |
          python tools/make_windows_release.py "0.1.$env:GITHUB_RUN_NUMBER" "build/windows/$env:GITHUB_SHA" build/launcher/HoldTheGatesLauncher.exe build/release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/launcher/LauncherTests.exe --bundle build/release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Windows release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, godot, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-public-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.sha }}
          path: build/release
      - name: Publish all three assets together
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_windows_release.py

  public-install:
    name: Install from the public Windows channel
    needs: [windows, publish]
    if: >-
      always() && needs.windows.result == 'success' &&
      (github.event_name == 'pull_request' || needs.publish.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build a previous-version launcher
        run: ./tools/build_launcher.ps1 -Version 0.0.0 -OutputDirectory build/old-launcher
      - name: Download from GitHub, follow the launcher update and start the installed game
        run: ./tools/test_public_launcher.ps1 -PreviousLauncher build/old-launcher/HoldTheGatesLauncher.exe
